[package]
name = "quietkey"
version = "0.1.0"
edition = "2021"
description = "后台播放/暂停：一个热键，不切窗口、不抢焦点"

[dependencies]
eframe = "0.35"
egui = "0.35"

global-hotkey = "0.8"
tray-icon = "0.24"

serde = { version = "1", features = ["derive"] }
toml = "1.1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # GSMTC 媒体会话（WinRT）
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
]

# 常驻小工具，体积和启动速度比编译时间重要。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
ico = "0.4"
winresource = "0.1"
